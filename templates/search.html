{% extends "layout.html" %}
{% block content %}
    <!-- Hauptinhalt -->
     <div class="big_content">
        <h2>HMM & Phylogenetic Analysis Tool</h2>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <div class="content-wrapper">
                <div class="content_upload">
                    <section>
                        <h3>1. Upload Section</h3>
                        <label for="file">Upload HMM File:</label>
                        <input type="file" name="file" id="file" multiple class="form-control mb-2">
                        <label for="pfam_id">Pfam-Domain (optional):</label>
                        
                        <input type="text" name="pfam_id" id="pfam_id" placeholder="z.B. PF00001" class="form-control">
                    </section>
                </div>

                <div class="content_plant">
                    <section class="mt-4">
                        <h3>2. Select plant species</h3>
                        <label for="species">Select plant species (≥2):</label>
                        <div id="species-selector" class="border p-2 mb-2 rounded" style="min-height: 30px; background-color: white; max-height: 150px; overflow-y: auto; width: 100%;"></div>
                        <input type="hidden" name="species" id="species-hidden">
                        <select id="species-options" class="form-control" size="10">
                            {% for specie in species %}
                            <option value="{{ specie }}">{{ specie }}</option>
                            {% endfor %}
                        </select>
                    </section>
                </div>

                <div class="content_filter">
                    <section class="mt-4">
                        <h3>3. Filterparameter</h3>
                        <label for="eValue">E-Value:</label>
                        <span title="The E-value indicates how many hits would be expected by chance. Lower values mean higher significance. Typical: 1e-5 or stricter."
                        style="cursor: help; color: #007bff;">&#x2753;</span>
                        <input type="text" id="eValue" name="eValue" placeholder="e.g. 1e-5" class="form-control mb-2">

                        <label for="coverage">Coverage (%):</label>
                        <span title="Specifies how much of the HMM is covered by the hit. Higher values indicate more complete matches."
                        style="cursor: help; color: #007bff;">&#x2753;</span>
                        <input type="text" id="coverage" name="coverage" placeholder="e.g. 100" class="form-control mb-2">

                        <label for="length">Minimum length:</label>
                        <span title="Minimum length of a hit in amino acids. Filters out short, often spurious matches. Typical: ≥ 50."
                        style="cursor: help; color: #007bff;">&#x2753;</span>
                        <input type="text" id="length" name="length" placeholder="e.g. 50" class="form-control">
                    </section>
                </div>

                <div class="content_workflow">
                    <section class="mt-4">
                        <h3>4. Analysis workflows for visualization</h3>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="run_alignment" id="run_alignment">
                            <label class="form-check-label" for="run_alignment">
                                Perform Multiple Sequence Alignment (MAFFT)
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="run_phylo" id="run_phylo">
                            <label class="form-check-label" for="run_phylo">
                                Calculate phylogenetic tree (FastTree)
                            </label>
                        </div>
                    </section>
                </div>

                <div class="content_storage">
                    <section class="mt-4">
                        <h3>5. Storage location</h3>
                        <label for="custom_folder">Enter storage folder name:</label>
                        <input type="text" id="custom_folder" name="custom_folder" placeholder="e.g. user123" class="form-control">
                        <small class="text-muted">Leave blank for automatic storage under your session.</small>
                    </section>
                    <button type="submit" class="btn btn-primary mt-3">Start analysis</button>
                    <button id="stop-analysis" class="btn btn-danger mt-3" style="display: none;">Stop Analysis</button>
                <div id="analysis_status" class="mt-4"></div>
                <div id="progress-container" class="mt-3" style="display:none;">
                    <label for="progress-bar">Progress:</label>
                    <progress id="progress-bar" value="0" max="100" style="width: 100%; height: 20px;"></progress>
                    <span id="progress-text">0%</span>
                </div>
            </div>
        </form>
     </div>
     <div class="content-wrapper">
        <div class="content_add_delete">
                <form action="/add_plant" method="post" enctype="multipart/form-data">
                    <label for="add_plant">Add new plant (optional):</label>
                    <input type="file" name="new_species" class="form-control me-2">
                    <button type="submit" class="btn btn-success">Add</button>
                </form>
                
                <form action="/delete_plant" method="post" enctype="multipart/form-data">
                    <label for="delete_plant">Delete plant (optional):</label>
                    <select name="species_to_delete" class="form-control me-2">
                    {% for specie in species %}
                        <option value="{{ specie }}">{{ specie }}</option>
                    {% endfor %}
                    </select>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
        </div> 
    </div>
{% endblock %}
